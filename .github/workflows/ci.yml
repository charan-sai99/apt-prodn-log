name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The legacy-migration test builds fixture files with the old app's own
      # pandas code, so the runner needs Python + pandas.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Database tests (throwaway local Postgres, never Supabase)
        run: npm run test:db
        env:
          PG_TEST_URL: postgres://postgres@localhost:5432/postgres
      - run: npm run build
